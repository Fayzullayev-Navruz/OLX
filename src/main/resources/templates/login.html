<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Tizimga kirish</h5>
        </div>
        <div class="card-body">
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Parol</label>
                    <input type="password" class="form-control" name="password" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100">Kirish</button>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = {
            email: e.target.email.value,
            password: e.target.password.value
        };

        try {
            const response = await fetch('http://localhost:8080/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            // if (!response.ok) {
            //     throw new Error('Login xatosi: ' + response.status);
            // }


            const result = await response.json(); // JSON formatida o‘qish
            const token = result.token; // Tokenni olish
            const role = result.role; // Role ni olish
console.log(result)
            // Tokenni localStorage yoki sessionStorage ga saqlash
            localStorage.setItem('authToken', token);

            // Roli bo‘yicha sahifaga yo‘naltirish
            if (role === 'MANAGER') {
                window.location.href = "http://localhost:63342/OLXk/security-test/templates/Unchecked.html";
            } else if (role === 'USER') {
                window.location.href = "http://localhost:63342/OLXk/security-test/templates/personal_cabinet.html";
            } else if (role === 'ADMIN') {
                window.location.href = "http://localhost:63342/OLXk/security-test/templates/userRoleFinally.html";
            } else {
                window.location.href = "http://localhost:63342/OLXk/security-test/templates/Unchecked.html";
            }

        } catch (error) {
            alert('Xatolik yuz berdi: ' + error.message);
        }
    });
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
