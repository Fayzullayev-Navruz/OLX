<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahsulot Tafsilotlari</title>
  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    /* Product Container */
    #productDetails {
      margin-top: 50px;
      background: white;
      padding: 20px;
      width: 80%;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease-in-out;
    }
    #productDetails:hover {
      transform: scale(1.02);
    }

    /* Product Image */
    .product-image img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 10px;
    }

    /* Product Info */
    .product-name {
      font-size: 26px;
      font-weight: bold;
      margin-top: 10px;
      color: #333;
    }
    .product-price {
      color: #28a745;
      font-size: 22px;
      margin-top: 5px;
    }
    .user-phone {
      margin-top: 15px;
      font-size: 18px;
      color: #666;
    }

    /* Chat Button */
    .chat-btn {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      background: linear-gradient(45deg, #007bff, #0056b3);
      color: white;
      border: none;
      border-radius: 25px;
      transition: all 0.3s ease;
    }
    .chat-btn:hover {
      background: linear-gradient(45deg, #0056b3, #003f80);
      transform: scale(1.05);
    }

    /* Chat Input Box */
    .chat-input {
      margin-top: 20px;
      display: none;
      transition: all 0.3s ease-in-out;
    }
    .chat-input input {
      width: 70%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .chat-input button {
      padding: 10px 20px;
      background: #28a745;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.3s ease;
    }
    .chat-input button:hover {
      background: #218838;
    }

    /* Authentication Modal */
    #authMessage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      font-size: 20px;
    }
    .auth-buttons {
      margin-top: 20px;
    }
    .auth-buttons button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      cursor: pointer;
      font-size: 18px;
      border-radius: 5px;
    }
    .sign-up {
      background-color: #ffc107;
      color: black;
    }
    .sign-up:hover {
      background-color: #e0a800;
    }
    .skip {
      background-color: #dc3545;
      color: white;
    }
    .skip:hover {
      background-color: #c82333;
    }

  </style>
</head>
<body>

<!-- Authentication Modal -->
<div id="authMessage">
  <p>❗ Xabar yuborish uchun ro'yxatdan o'tishingiz kerak.</p>
  <div class="auth-buttons">
    <button class="sign-up" onclick="signUp()">Sign Up</button>
    <button class="skip" onclick="skipAuth()">Skip</button>
  </div>
</div>

<!-- Product Details -->
<div id="productDetails"></div>

<!-- User Phone Number -->
<div class="user-phone" id="userPhone"></div>

<!-- Chat Button -->
<button class="chat-btn" onclick="toggleChatInput()">💬 Chat</button>

<!-- Chat Input -->
<div class="chat-input" id="chatInput">
  <input type="text" id="chatMessage" placeholder="Xabaringizni yozing...">
  <button onclick="sendMessage()">📩 Yuborish</button>
</div>

<script>
  let isUserLoggedIn = false;
  const token = localStorage.getItem('authToken');

  function checkAuth() {
    if (!token) {
      document.getElementById('authMessage').style.display = 'flex';
      isUserLoggedIn = false;
    } else {
      document.getElementById('authMessage').style.display = 'none';
      isUserLoggedIn = true;
    }
  }

  function signUp() {
    window.location.href = "http://localhost:63342/OLXk/security-test/templates/sign_up.html";
  }

  function skipAuth() {
    document.getElementById('authMessage').style.display = 'none';
    isUserLoggedIn = true;
  }

  function toggleChatInput() {
    checkAuth();
    if (!isUserLoggedIn) return;
    const chatInput = document.getElementById('chatInput');
    chatInput.style.display = chatInput.style.display === 'none' ? 'block' : 'none';
  }

  async function getProductIdFromURL() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('productId');
  }

  async function loadProductDetails() {
    checkAuth();
    const productId = await getProductIdFromURL();
    if (!productId) {
      console.error("Mahsulot ID si URL da yo‘q.");
      return;
    }

    try {
      let response = await fetch(`http://localhost:8080/product/one/${productId}`, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json'
        }
      });

      if (!response.ok) {
        throw new Error('Mahsulotni yuklashda xatolik!');
      }

      let product = await response.json();
      document.getElementById('productDetails').innerHTML = `
        <div class="product-image">
          <img src="http://localhost:8080/images/${product.attachmentId}" alt="${product.name}">
        </div>
        <div class="product-name">${product.name}</div>
        <div class="product-price">${product.price}</div>
      `;
      document.getElementById('userPhone').textContent = `📞 Foydalanuvchi Telefoni: ${product.sender.userPhone}`;
    } catch (error) {
      console.error('Mahsulot tafsilotlarini yuklashda xatolik:', error);
    }
  }

  async function sendMessage() {
    if (!isUserLoggedIn) return;
    const message = document.getElementById('chatMessage').value;
    const productId = await getProductIdFromURL();
    if (!message || !productId) return;

    try {
      await fetch('http://localhost:8080/message', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ message, productId: parseInt(productId) })
      });
      document.getElementById('chatMessage').value = '';
    } catch (error) {
      console.error('Xabar yuborishda xatolik:', error);
    }
  }

  window.onload = loadProductDetails;
</script>

</body>
</html>
