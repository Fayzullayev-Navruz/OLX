<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - CRUD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fc;
            color: #333;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #4e73df;
            margin-bottom: 20px;
        }

        h2 {
            color: #4e73df;
            margin-bottom: 15px;
        }

        .form-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .form-container input,
        .form-container select,
        .form-container button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 16px;
        }

        .form-container button {
            background-color: #4e73df;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .form-container button:hover {
            background-color: #2e59d9;
        }

        /* Product List */
        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: scale(1.05);
        }

        .product-card img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .product-card h3 {
            font-size: 18px;
            margin: 10px 0;
        }

        .product-card p {
            color: #555;
            font-size: 16px;
        }

        .product-card button {
            background-color: #ff6347;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        .product-card button:hover {
            background-color: #ff4500;
        }
    </style>
</head>
<body>

<h1>Product Management - CRUD</h1>

<!-- Add/Update Product Form -->
<div class="form-container">
    <h2>Add or Update Product</h2>
    <form id="productForm" enctype="multipart/form-data">
        <input type="hidden" id="productId" name="id"> <!-- Hidden input for product ID (for update) -->
        <select id="categorySelect" name="category" required>
            <option value="">Select Category</option>
        </select>
        <select id="childCategorySelect" name="childCategory" required disabled>
            <option value="">Select Subcategory</option>
        </select>
        <input type="text" id="productName" name="name" placeholder="Product Name" required>
        <input type="text" id="productDescription" name="description" placeholder="Description" required>
        <input type="number" id="productPrice" name="price" placeholder="Price" required>
        <input type="file" id="productImage" name="image" accept="image/*">
        <button type="submit">Add Product</button>
    </form>
</div>

<!-- Product List -->
<h2>Product List</h2>
<div class="product-container" id="productContainer">
    <!-- Products will be displayed here -->
</div>

<script>
    const token = localStorage.getItem('authToken'); // Retrieve the token from localStorage
    if (!token) {
        alert("You are not logged in.");
        window.location.href = '/login.html'; // Redirect to login page if no token
    }

    // Fetch categories and display them in the dropdown
    fetchCategories();

    function fetchCategories() {
        fetch('http://localhost:8080/category/string', {
            headers: {
                'Authorization': `Bearer ${token}` // Include the token in the request
            }
        })
            .then(response => response.json())
            .then(categories => {
                const categorySelect = document.getElementById('categorySelect');
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id; // Store category ID as value
                    option.textContent = category.name;
                    categorySelect.appendChild(option);
                });
            });
    }

    // Fetch child categories when a category is selected
    document.getElementById('categorySelect').addEventListener('change', function() {
        const categoryValue = this.value;
        if (categoryValue) {
            fetchChildCategories(categoryValue);
        }
    });

    function fetchChildCategories(categoryValue) {
        fetch(`http://localhost:8080/child_category/stringchild/${categoryValue}`, {
            headers: {
                'Authorization': `Bearer ${token}` // Include the token in the request
            }
        })
            .then(response => response.json())
            .then(childCategories => {
                const childCategorySelect = document.getElementById('childCategorySelect');
                childCategorySelect.innerHTML = '<option value="">Select Subcategory</option>'; // Clear current options
                if (Array.isArray(childCategories)) {
                    childCategories.forEach(childCategory => {
                        const option = document.createElement('option');
                        option.value = childCategory.id;
                        option.textContent = childCategory.name;
                        childCategorySelect.appendChild(option);
                    });
                    childCategorySelect.disabled = false;
                } else {
                    childCategorySelect.disabled = true;
                }
            });
    }

    // Add or Update product form submission
    document.getElementById('productForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const formData = new FormData(this);

        // Get product ID to determine if it's an update or new product
        const productId = document.getElementById('productId').value;

        if (productId) {
            updateProduct(productId, formData); // If productId exists, it's an update
        } else {
            addProduct(formData); // Otherwise, it's an add
        }
    });

    // Add a new product
    function addProduct(formData) {
        const childCategoryId = document.getElementById('childCategorySelect').value;
        formData.append('childCategory', childCategoryId);

        fetch('http://localhost:8080/product/add', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}` // Include the token in the request
            },
            body: formData
        })
            .then(response => response.json())
            .then(() => {
                alert('Product added successfully');
                fetchProducts(); // Refresh product list
                document.getElementById('productForm').reset(); // Clear form
            })
            .catch(error => console.error('Error adding product:', error));
    }

    // Update an existing product
    function updateProduct(productId, formData) {
        fetch(`http://localhost:8080/product/update?id=${productId}`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}` // Include the token in the request
            },
            body: formData
        })
            .then(response => response.json())
            .then(() => {
                alert('Product updated successfully');
                fetchProducts(); // Refresh product list
                document.getElementById('productForm').reset(); // Clear form
            })
            .catch(error => console.error('Error updating product:', error));
    }

    // Fetch product list
    function fetchProducts() {
        fetch('http://localhost:8080/product/myOwn', {
            headers: {
                'Authorization': `Bearer ${token}` // Include the token in the request
            }
        })
            .then(response => response.json())
            .then(products => {
                const productContainer = document.getElementById('productContainer');
                productContainer.innerHTML = '';
                products.forEach(product => {
                    const productCard = document.createElement('div');
                    productCard.classList.add('product-card');
                    productCard.innerHTML = `
                        <img src="http://localhost:8080/images/${product.attachmentId}" alt="Category Image">
                        <h3>${product.name}</h3>
                        <p>${product.description}</p>
                        <p>Price: $${product.price}</p>
                        <button onclick="editProduct(${product.id})">Edit</button>
                        <button onclick="deleteProduct(${product.id})">Delete</button>
                    `;
                    productContainer.appendChild(productCard);
                });
            });
    }

    // Delete product
    function deleteProduct(productId) {
        fetch(`http://localhost:8080/product/delete/${productId}`, {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${token}` // Include the token in the request
            }
        })
            .then(response => response.json())
            .then(() => {
                alert('Product deleted');
                fetchProducts(); // Refresh product list
            });
    }

    // Edit product
    function editProduct(productId) {
        fetch(`http://localhost:8080/product/one/${productId}`, {
            headers: {
                'Authorization': `Bearer ${token}` // Include the token in the request
            }
        })
            .then(response => response.json())
            .then(product => {
                document.getElementById('productId').value = product.id;
                document.getElementById('productName').value = product.name;
                document.getElementById('productDescription').value = product.description;
                document.getElementById('productPrice').value = product.price;

                // Set selected category and child category
                document.getElementById('categorySelect').value = product.categoryId;
                fetchChildCategories(product.categoryId); // Load child categories based on selected category
                setTimeout(() => {
                    document.getElementById('childCategorySelect').value = product.childCategoryId; // Set child category
                }, 500); // Delay to ensure child categories are loaded
            })
            .catch(error => console.error('Error fetching product details:', error));
    }

    // Initialize by fetching products
    fetchProducts();
</script>

</body>
</html>
