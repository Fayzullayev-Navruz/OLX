<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Ro'yxatdan o'tish</h5>
        </div>
        <div class="card-body">
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="fullName" placeholder="Masalan: Aliyev Ali" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefon raqami</label>
                    <input type="text" class="form-control" name="phoneNumber" placeholder="+998XXXXXXXXX" value="+998" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Parol</label>
                    <input type="password" class="form-control" name="password" required/>
                </div>
                <button type="submit" class="btn btn-success w-100">
                    Ro'yxatdan o'tish
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = {
            username: e.target.username.value,
            email: e.target.email.value,
            fullName: e.target.fullName.value,
            phoneNumber: e.target.phoneNumber.value,
            password: e.target.password.value
        };

        try {
            const response = await fetch('http://localhost:8080/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json(); // Read the response as JSON

            console.log(result);

            const token = result.token; // Extract the token
            const role = result.role; // Extract the role
            console.log(result);

            // Store the token in localStorage or sessionStorage
            localStorage.setItem('authToken', token);

            // Handle the role-based redirection
            if (role === 'MANAGER') {
                window.location.href = "http://localhost:63342/OLXk/security-test/templates/Unchecked.html";
            } else if (role === 'USER') {
                window.location.href = "http://localhost:63342/OLXk/security-test/templates/personal_cabinet.html";
            } else if (role === 'ADMIN') {
                window.location.href = "http://localhost:63342/OLXk/security-test/templates/userRoleFinally.html";
            } else {
                alert('Unexpected role: ' + role);
            }
        } catch (error) {
            alert('Xatolik yuz berdi: ' + error.message);
        }
    });

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
